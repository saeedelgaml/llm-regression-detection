# CI regression gate for the egypt-data-jobs chatbot (a reusable workflow).
#
# Called from egypt-data-jobs/.github/workflows/pages.yml:
#   eval:
#     uses: saeedelgaml/llm-regression-detection/.github/workflows/eval.yml@main
#
# GitHub's servers have no Ollama, so this job checks only the deterministic parts:
# the route each golden question takes and whether search finds the right passage.
# It compares them with baseline_ci.json and fails (blocking the deploy) on a regression.
name: LLM regression gate

on:
  workflow_call:
    inputs:
      eval_ref:
        description: Branch or tag of llm-regression-detection to use (keep it the same as the @ref in "uses:")
        type: string
        default: main

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EGYPT_CHATBOT_DIR: ${{ github.workspace }}/chatbot
      EGYPT_CHATBOT_DB: ${{ github.workspace }}/chatbot/data/sample.duckdb
    steps:
      - name: Check out the chatbot (the repo that called this workflow)
        uses: actions/checkout@v4
        with:
          path: chatbot

      - name: Check out the evaluator
        uses: actions/checkout@v4
        with:
          repository: saeedelgaml/llm-regression-detection
          ref: ${{ inputs.eval_ref }}
          path: evaluator

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chatbot/requirements*.txt

      - name: Install the chatbot's requirements (CPU-only PyTorch, no GPU on the runner)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r chatbot/requirements-dev.txt

      - name: Cache the report PDFs
        uses: actions/cache@v4
        with:
          path: chatbot/rag/docs
          key: report-docs-${{ hashFiles('evaluator/ci/docs.json') }}

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Download the report PDFs (SHA-256 checked)
        run: python evaluator/ci/fetch_docs.py chatbot/rag/docs

      - name: Build the search index
        working-directory: chatbot
        run: python -m rag.ingest

      - name: Run the golden set in CI mode (route + search, no language model)
        working-directory: evaluator
        run: python evaluator/run_eval.py --adapter egypt_data_jobs --ci --out results/run_ci.json

      - name: Regression gate (compare with baseline_ci.json)
        working-directory: evaluator
        run: python evaluator/compare.py results/run_ci.json baseline_ci.json

      - name: Keep the report card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evaluator/results/
          if-no-files-found: ignore
